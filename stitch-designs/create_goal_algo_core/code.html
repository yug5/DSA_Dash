<style>
        body { font-family: 'Geist Sans', sans-serif; background-color: #0B0C0E; color: #e3e3e0; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .bg-card { background-color: #131519; }
        .border-hairline { border-color: #25282D; }
        .btn-primary { background-color: #8BAF9A; color: #0B0C0E; }
        .btn-secondary { background-color: transparent; border: 1px solid #25282D; color: #F2F2F0; }
        .btn-secondary:hover { background-color: #17191D; }
        .input-base { background-color: #0F1113; border: 1px solid #25282D; color: #e3e3e0; }
        .input-base:focus { border-color: #8BAF9A; outline: none; }
        .ambient-shadow { box-shadow: 0 0 20px rgba(0, 0, 0, 0.4); }
    </style>

<body class="bg-background min-h-screen flex text-on-surface antialiased overflow-hidden">
<!-- Background Layer (Simulated Goals Page) -->
<div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuABC3ivwMWcK2E2CeFsK48g6eW4rG6QAvDf3CXFyUWCMqK9YxwkbWw00Ey-WSe-cxjO6cMK2NAZQPlxcwnlMI1qT9ZqAa0ihWlf_sCokM5m9GR80kATkMTXWWSIHG3LPP2SFf4gmFoP-fGJZ3jekFdxhwis_kQqmfTEhmfsAE5O-rJSPhl98u2IhBNpP3gDoo-ArsPSerSzNajBETmSev4h_ie82TmXy6bkqw-9To0yyF2qjw4J3yp_'); background-size: cover; background-position: center;"></div>
<!-- Modal Overlay Backdrop -->
<div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 flex items-center justify-center p-4">
<!-- Modal Container -->
<div class="bg-card border border-hairline rounded-lg w-full max-w-2xl ambient-shadow flex flex-col max-h-[921px] z-50">
<!-- Modal Header -->
<div class="flex items-center justify-between p-stack-lg border-b border-hairline">
<h2 class="font-headline-lg text-headline-lg text-on-surface">Create a practice goal</h2>
<button class="text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="p-stack-lg overflow-y-auto flex flex-col md:flex-row gap-stack-lg">
<!-- Left Column: Inputs -->
<div class="flex-1 flex flex-col gap-stack-lg">
<!-- Daily Target Section -->
<div class="flex flex-col gap-stack-sm">
<label class="font-mono-label text-mono-label text-on-surface-variant uppercase tracking-wider">Daily Target (Questions)</label>
<div class="grid grid-cols-4 gap-2">
<button class="btn-secondary rounded py-2 font-mono-data text-mono-data hover:bg-surface-container-high transition-colors">3</button>
<button class="bg-primary-container text-on-primary-container rounded py-2 font-mono-data text-mono-data font-medium">5</button>
<button class="btn-secondary rounded py-2 font-mono-data text-mono-data hover:bg-surface-container-high transition-colors">10</button>
<div class="relative">
<input class="input-base w-full h-full rounded px-3 py-2 font-mono-data text-mono-data text-center placeholder:text-on-surface-variant" placeholder="Custom" type="number"/>
</div>
</div>
</div>
<!-- Duration Section -->
<div class="flex flex-col gap-stack-sm">
<label class="font-mono-label text-mono-label text-on-surface-variant uppercase tracking-wider">Duration</label>
<div class="grid grid-cols-3 gap-2">
<button class="btn-secondary rounded py-2 font-mono-data text-mono-data hover:bg-surface-container-high transition-colors">1 week</button>
<button class="bg-primary-container text-on-primary-container rounded py-2 font-mono-data text-mono-data font-medium">1 month</button>
<div class="relative">
<input class="input-base w-full h-full rounded px-3 py-2 font-mono-data text-mono-data text-center placeholder:text-on-surface-variant" placeholder="Custom" type="text"/>
</div>
</div>
</div>
</div>
<!-- Right Column: Live Calculation -->
<div class="w-full md:w-[240px] bg-surface-container-lowest border border-hairline rounded p-stack-md flex flex-col">
<h3 class="font-mono-label text-mono-label text-on-surface-variant uppercase tracking-wider mb-stack-md border-b border-hairline pb-2">YOUR PLAN</h3>
<div class="flex flex-col gap-4 flex-1">
<div class="flex justify-between items-baseline">
<span class="font-body-md text-body-md text-on-surface-variant">Daily Rate:</span>
<span class="font-mono-data text-mono-data text-primary">5 q/day</span>
</div>
<div class="flex justify-between items-baseline">
<span class="font-body-md text-body-md text-on-surface-variant">Duration:</span>
<span class="font-mono-data text-mono-data text-on-surface">30 days</span>
</div>
<div class="mt-auto pt-4 border-t border-hairline flex flex-col gap-2">
<div class="flex justify-between items-end">
<span class="font-body-md text-body-md text-on-surface-variant">Total Target:</span>
<span class="font-headline-md text-headline-md text-on-surface font-bold">150</span>
</div>
<div class="flex justify-between items-baseline text-sm">
<span class="font-mono-label text-mono-label text-outline-variant">Projected:</span>
<span class="font-mono-data text-mono-data text-outline-variant">~144</span>
</div>
</div>
</div>
</div>
</div>
<!-- Modal Footer -->
<div class="p-stack-lg border-t border-hairline flex justify-end gap-3 bg-surface-container-lowest/50">
<button class="btn-secondary px-6 py-2 rounded font-body-md text-body-md font-medium transition-colors">Cancel</button>
<button class="btn-primary px-6 py-2 rounded font-body-md text-body-md font-medium transition-opacity hover:opacity-90">Create Goal</button>
</div>
</div>
</div>
</body></html>
