<!DOCTYPE html>

<html class="dark" lang="en"><head>

<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-6 antialiased selection:bg-primary-container selection:text-on-primary-container">
<div class="w-full max-w-sm flex flex-col gap-stack-lg">
<!-- Header Section -->
<div class="flex flex-col items-center text-center gap-stack-sm mb-4">
<!-- Brand Logo -->
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary font-variation-settings: 'FILL' 1;" style="font-variation-settings: 'FILL' 1;">terminal</span>
<span class="font-display text-display text-primary tracking-tighter">ALGO_CORE</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Continue your DSA practice.</p>
</div>
<!-- Error State Alert (Simulated) -->
<div class="bg-error-container/10 border border-error/20 rounded p-4 flex items-start gap-3">
<span class="material-symbols-outlined text-error text-xl shrink-0">error</span>
<p class="font-body-md text-body-md text-error">Unable to sign in. Check your credentials and try again.</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault(); document.getElementById('submitBtn').classList.add('loading'); setTimeout(()=&gt;document.getElementById('submitBtn').classList.remove('loading'), 2000)">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-mono-label text-mono-label text-on-surface-variant" for="email">EMAIL ADDRESS</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">mail</span>
<input class="w-full bg-[#0F1113] border border-outline-variant text-on-surface font-mono-data text-mono-data rounded pl-10 pr-4 py-2.5 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-on-surface-variant/50" id="email" placeholder="developer@example.com" type="email" value="developer@example.com"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-mono-label text-mono-label text-on-surface-variant" for="password">PASSWORD</label>
<a class="font-body-md text-body-md text-primary hover:text-primary-fixed transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">key</span>
<input class="w-full bg-[#0F1113] border border-outline-variant text-on-surface font-mono-data text-mono-data rounded pl-10 pr-4 py-2.5 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-on-surface-variant/50" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Submit Button (Normal & Loading State) -->
<button class="group relative w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md rounded py-2.5 mt-2 transition-all hover:bg-primary-fixed flex items-center justify-center overflow-hidden" id="submitBtn" type="submit">
<span class="btn-text">Sign in</span>
<!-- Loading Spinner (Hidden by default, shown via class toggle in JS) -->
<svg class="animate-spin hidden absolute h-5 w-5 text-on-primary-container group-[.loading]:block" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
<style>
                    #submitBtn.loading .btn-text { opacity: 0; }
                </style>
</button>
</form>
<!-- Footer Links -->
<div class="text-center mt-4">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? <a class="text-primary hover:text-primary-fixed font-medium transition-colors" href="#">Sign up</a>
</p>
</div>
</div>
</body></html>
