<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ALGO_CORE - Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#ffdad9",
                        "outline-variant": "#414844",
                        "inverse-on-surface": "#2f312f",
                        "surface-container-lowest": "#0d0f0d",
                        "surface-container-highest": "#333533",
                        "primary": "#aacfb9",
                        "secondary-fixed": "#e2e2e8",
                        "surface-bright": "#383a38",
                        "surface-container": "#1e201e",
                        "surface-container-low": "#1a1c1a",
                        "on-secondary-container": "#bbbbc1",
                        "error": "#ffb4ab",
                        "on-surface-variant": "#c1c8c2",
                        "on-background": "#e3e3e0",
                        "on-tertiary-fixed-variant": "#633c3d",
                        "primary-container": "#8baf9a",
                        "tertiary-fixed-dim": "#f0b9b9",
                        "surface": "#121412",
                        "inverse-primary": "#446553",
                        "error-container": "#93000a",
                        "surface-tint": "#aacfb9",
                        "surface-variant": "#333533",
                        "on-primary": "#153627",
                        "on-tertiary-fixed": "#311213",
                        "surface-container-high": "#292a29",
                        "on-primary-container": "#214332",
                        "on-primary-fixed-variant": "#2c4d3d",
                        "on-secondary-fixed-variant": "#45474b",
                        "primary-fixed-dim": "#aacfb9",
                        "on-secondary-fixed": "#1a1c20",
                        "on-secondary": "#2f3035",
                        "primary-fixed": "#c6ebd4",
                        "surface-dim": "#121412",
                        "on-error-container": "#ffdad6",
                        "tertiary": "#f0b9b9",
                        "on-primary-fixed": "#002113",
                        "secondary-fixed-dim": "#c6c6cb",
                        "tertiary-container": "#ce9a9a",
                        "secondary-container": "#4a4b50",
                        "on-tertiary-container": "#573233",
                        "inverse-surface": "#e3e3e0",
                        "on-surface": "#e3e3e0",
                        "background": "#121412",
                        "on-tertiary": "#4a2627",
                        "on-error": "#690005",
                        "outline": "#8b928d",
                        "secondary": "#c6c6cb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "sidebar-width": "240px",
                        "sidebar-collapsed": "64px",
                        "stack-lg": "24px",
                        "stack-sm": "8px",
                        "container-padding": "32px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "mono-data": ["JetBrains Mono"],
                        "body-lg": ["Geist"],
                        "headline-lg": ["Geist"],
                        "body-md": ["Geist"],
                        "headline-md": ["Geist"],
                        "mono-label": ["JetBrains Mono"],
                        "display": ["Geist"]
                    },
                    "fontSize": {
                        "mono-data": ["14px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "mono-label": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "display": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .input-field {
                @apply w-full bg-[#0F1113] border border-[#25282D] rounded text-on-surface focus:border-primary-container focus:ring-0 transition-colors duration-200 outline-none;
            }
            .btn-primary {
                @apply w-full bg-primary-container text-[#0B0C0E] rounded font-headline-md text-headline-md py-3 hover:opacity-90 transition-opacity duration-200;
            }
        }
    </style>
</head>
<body class="bg-[#0B0C0E] text-on-surface min-h-screen flex items-center justify-center p-gutter font-body-md">
<div class="w-full max-w-md bg-[#131519] border border-[#25282D] rounded p-stack-lg flex flex-col gap-stack-lg">
<!-- Header -->
<div class="text-center flex flex-col gap-stack-sm">
<h1 class="font-display text-display text-on-surface">Create your account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Start building a consistent DSA practice habit.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-stack-md">
<div class="flex flex-col gap-stack-sm">
<label class="font-mono-label text-mono-label text-on-surface-variant uppercase" for="name">Name</label>
<input class="input-field py-2 px-3 font-mono-data text-mono-data" id="name" name="name" placeholder="Alan Turing" required="" type="text"/>
</div>
<div class="flex flex-col gap-stack-sm">
<label class="font-mono-label text-mono-label text-on-surface-variant uppercase" for="email">Email</label>
<input class="input-field py-2 px-3 font-mono-data text-mono-data" id="email" name="email" placeholder="alan@enigma.com" required="" type="email"/>
</div>
<div class="flex flex-col gap-stack-sm">
<label class="font-mono-label text-mono-label text-on-surface-variant uppercase" for="password">Password</label>
<div class="relative w-full">
<input class="input-field py-2 px-3 font-mono-data text-mono-data w-full" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="flex flex-col gap-stack-sm">
<label class="font-mono-label text-mono-label text-on-surface-variant uppercase" for="confirm-password">Confirm Password</label>
<input class="input-field py-2 px-3 font-mono-data text-mono-data" id="confirm-password" name="confirm-password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="mt-4">
<button class="btn-primary" type="submit">Create account</button>
</div>
</form>
<!-- Footer -->
<div class="text-center border-t border-[#25282D] pt-stack-md mt-2">
<p class="font-body-md text-body-md text-on-surface-variant">
                Already have an account? 
                <a class="text-primary hover:text-primary-container transition-colors duration-200" href="#">Sign in</a>
</p>
</div>
</div>
</body></html>
